name: Android CI

on:
  push:
    branches: [ "kiwi" ]
  pull_request:
    branches: [ "kiwi" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate repository structure
      run: |
        echo "✓ Repository cloned successfully"
        echo "Chromium-based build detected (Kiwi Browser fork)"
        if [ -f "fetch_from_upstream.sh" ]; then
          echo "✓ Build scripts found"
        fi
    
    - name: Local build instructions
      run: |
        echo "This is a Chromium/Kiwi Browser fork"
        echo "Builds happen via the build_apk.yml workflow"
        echo "For local Termux builds, see instructions below"
